name: Build Intel macOS app
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - run: cmake --build build --parallel 3
      - name: Package app
        run: |
          mkdir -p dist
          APP="build/OutbreakCityZero.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/OutbreakCityZero-macOS-Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OutbreakCityZero-macOS-Intel
          path: dist/OutbreakCityZero-macOS-Intel.zip
          if-no-files-found: error
      - name: Attach artifact to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/OutbreakCityZero-macOS-Intel.zip --clobber
